<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="训练计划">
  <meta name="theme-color" content="#0b0b0c">
  <title>双周训练计划</title>
  <style>
    :root{--bg:#0b0b0c;--card:#161618;--card2:#1d1d20;--text:#f5f5f7;--muted:#9b9ba1;--line:#2b2b30;--good:#8fe388;--bad:#ff8a8a;--warn:#ffd67d}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}
    body{min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.app{max-width:560px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:14px;margin-bottom:18px}h1{font-size:29px;line-height:1.08;margin:0 0 6px;font-weight:760;letter-spacing:-.03em}.sub,.hint{font-size:13px;color:var(--muted);line-height:1.55}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-size:13px;white-space:nowrap}.hero,.section,.cycle{border:1px solid var(--line);background:var(--card);border-radius:20px;overflow:hidden}.hero{background:linear-gradient(180deg,#18181b,#121214);border-radius:24px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.18)}.eyebrow{font-size:13px;color:var(--muted);margin-bottom:7px}.daytitle{font-size:34px;font-weight:780;letter-spacing:-.035em;margin:0 0 7px}.desc{font-size:15px;color:#c7c7cc;line-height:1.5}.list{display:flex;flex-direction:column;gap:10px;margin:15px 0}.item{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:17px}.itemTop{display:flex;align-items:center;gap:12px}.check{appearance:none;width:24px;height:24px;border-radius:8px;border:1.5px solid #55565d;background:#101012;flex:0 0 auto;display:grid;place-items:center}.check:checked{background:#f5f5f7;border-color:#f5f5f7}.check:checked::after{content:"✓";color:#111;font-size:16px;font-weight:800}.name{font-size:16px;font-weight:600}.done .name{color:#7f7f85;text-decoration:line-through}.last{margin:8px 0 0 36px;font-size:12px;color:var(--muted)}.weightField{display:flex;align-items:center;margin:12px 0 0 36px;background:#101012;border:1px solid var(--line);border-radius:12px;padding:0 10px}.weightField.missing{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}.weightField input{width:100%;min-width:0;padding:10px 0;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.unit{font-size:12px;color:var(--muted);margin-left:4px}.notice{display:none;margin:14px 0 0;padding:11px 13px;border:1px solid var(--warn);border-radius:13px;color:var(--warn);font-size:13px;line-height:1.45}.notice.show{display:block}.progress{height:7px;background:#242428;border-radius:999px;overflow:hidden;margin:16px 0 3px}.bar{height:100%;width:0;background:var(--good);transition:width .2s ease}.progressText{font-size:12px;color:var(--muted);text-align:right}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}button{border:0;border-radius:15px;padding:13px 10px;font-size:15px;background:var(--card2);color:var(--text);font-weight:620}button:active{transform:scale(.985)}button.primary{background:#f5f5f7;color:#111}.section{margin-top:15px}.section summary{list-style:none;padding:16px 17px;font-size:15px;font-weight:650;cursor:pointer}.section summary::-webkit-details-marker{display:none}.inner{border-top:1px solid var(--line);padding:16px 17px}label.small{display:block;font-size:13px;color:var(--muted);margin:11px 0 7px}.textinput,input[type=date]{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:#101012;color:var(--text);font-size:16px}.status{font-size:13px;margin-top:10px;color:var(--muted)}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.historyCard{padding:12px 0;border-bottom:1px solid var(--line)}.historyCard:last-child{border:0}.historyName{font-weight:650;margin-bottom:7px}.historyLine{font-size:13px;color:#c7c7cc;line-height:1.6}.gain{color:var(--good)}.cycle{margin-top:14px}.cycleHead{padding:16px 17px;font-weight:650;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 17px;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}.row.now{background:#202024}.rday{color:var(--muted)}.rname{font-weight:600}.footer{font-size:12px;color:#6f6f75;text-align:center;margin:18px 0 4px}
  </style>
</head>
<body><main class="app">
  <div class="top"><div><h1>双周训练计划</h1><div class="sub" id="dateText"></div></div><div class="pill" id="cyclePill">第 1 天</div></div>
  <section class="hero"><div class="eyebrow" id="weekText">第 1 周</div><div class="daytitle" id="workoutTitle"></div><div class="desc" id="workoutDesc"></div><div id="workoutList" class="list"></div><div id="notice" class="notice"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="progressText" class="progressText"></div></section>
  <nav class="nav"><button id="prevBtn">← 前一天</button><button id="todayBtn" class="primary">今天</button><button id="nextBtn">后一天 →</button></nav>
  <details class="section"><summary>进步记录</summary><div class="inner" id="history"></div></details>
  <details class="section"><summary>GitHub 连接</summary><div class="inner"><div class="hint">首次设置后，网页会在这台设备的浏览器中记住 token；以后打开即自动连接，不需要重复输入。</div><label class="small" for="ghToken">Fine-grained token（只需第一次填写）</label><input id="ghToken" class="textinput" type="password" autocomplete="off" placeholder="github_pat_…"><div class="hint">仅授权仓库 <b>DDDDUJJU/workout</b>，权限只需 Contents: Read and write。token 不会写入网页源码或 GitHub。</div><button id="ghSave" style="margin-top:12px">保存并连接</button><div id="ghStatus" class="status">尚未连接</div></div></details>
  <details class="section"><summary>设置循环起始日</summary><div class="inner"><label class="small" for="startDate">把哪一天定义为“第 1 天 / 第一周周一”</label><input id="startDate" type="date"><div class="hint">以后会自动按 14 天循环。</div></div></details>
  <section class="cycle"><div class="cycleHead">14 天总览</div><div id="cycleList"></div></section><div class="footer">完成当天训练并填完重量后自动同步到 GitHub</div>
</main>
<script>
const OWNER='DDDDUJJU', REPO='workout', BRANCH='main', PATH='training-data.json';
const plan=[
 {name:'背',desc:'背部主训练',items:['中立握高位下拉','坐姿绳索划船']},{name:'自行车',desc:'有氧训练',items:['自行车']},{name:'肩 + 胸',desc:'肩部优先，胸部适量',items:['绳索侧平举','反向蝴蝶机','龙门架夹胸']},{name:'休息',desc:'完全休息',items:[]},{name:'手臂 + 少量背',desc:'手臂训练，并补一次背部刺激',items:['绳索下压','绳索弯举','中立握高位下拉']},{name:'腿',desc:'下肢每周一次',items:['自由深蹲','坐姿腿弯举']},{name:'慢跑',desc:'有氧训练',items:['慢跑']},{name:'肩 + 胸',desc:'肩部优先，胸部适量',items:['绳索侧平举','反向蝴蝶机','龙门架夹胸']},{name:'自行车',desc:'有氧训练',items:['自行车']},{name:'背',desc:'背部主训练',items:['中立握高位下拉','坐姿绳索划船']},{name:'休息',desc:'完全休息',items:[]},{name:'手臂 + 少量肩',desc:'手臂训练，并补一次侧肩刺激',items:['绳索下压','绳索弯举','绳索侧平举']},{name:'腿',desc:'下肢每周一次',items:['自由深蹲','坐姿腿弯举']},{name:'慢跑',desc:'有氧训练',items:['慢跑']}];
const strength=new Set(['中立握高位下拉','坐姿绳索划船','绳索侧平举','反向蝴蝶机','龙门架夹胸','绳索下压','绳索弯举','自由深蹲','坐姿腿弯举']); const $=s=>document.querySelector(s);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}; const mod=(n,m)=>((n%m)+m)%m; const diff=(a,b)=>Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate())-new Date(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);
const logs=()=>{try{return JSON.parse(localStorage.getItem('training_logs')||'{}')}catch{return{}}}; const saveLogs=x=>localStorage.setItem('training_logs',JSON.stringify(x)); const history=n=>[...(logs()[n]||[])].sort((a,b)=>b.date.localeCompare(a.date)); const doneKey=(d,i)=>`training_done_${ymd(d)}_${i}`; const weightKey=(d,i)=>`training_weight_${ymd(d)}_${i}`;
let today=new Date(), viewDate=new Date(today.getFullYear(),today.getMonth(),today.getDate()); let start=localStorage.getItem('training_start')||ymd(today); localStorage.setItem('training_start',start); $('#startDate').value=start; const idx=d=>mod(diff(d,parse($('#startDate').value)),14);
function notice(text=''){const n=$('#notice');n.textContent=text;n.classList.toggle('show',!!text)} function status(text,type=''){const e=$('#ghStatus');e.textContent=text;e.className='status '+type}
function payload(){const done={};const weights={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith('training_done_'))done[k]=localStorage.getItem(k);if(k?.startsWith('training_weight_'))weights[k]=localStorage.getItem(k)}return {version:4,updatedAt:new Date().toISOString(),start:localStorage.getItem('training_start'),logs:logs(),done,weights}}
function record(name,date,weight){const all=logs();all[name]??=[];const item={date,weight:Number(weight)};const i=all[name].findIndex(x=>x.date===date);i<0?all[name].push(item):all[name][i]=item;saveLogs(all)}
function b64(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s)))}
async function push(){const token=localStorage.getItem('github_token');if(!token){status('还没有 token：数据已保存在本机，连接后会自动同步。','bad');return false}try{status('正在自动提交…');const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'};let sha;const get=await fetch(`${url}?ref=${BRANCH}`,{headers});if(get.ok)sha=(await get.json()).sha;else if(get.status!==404)throw Error(`读取失败 ${get.status}`);const body={message:`记录训练 · ${ymd(viewDate)}`,content:b64(JSON.stringify(payload(),null,2)),branch:BRANCH};if(sha)body.sha=sha;const put=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!put.ok)throw Error(`提交失败 ${put.status}`);status(`已自动提交 · ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`,'good');return true}catch(e){status(`同步失败：${e.message}`,'bad');return false}}
function autoSubmit(){const p=plan[idx(viewDate)], date=ymd(viewDate);if(!p.items.length)return;const allDone=p.items.every((_,i)=>localStorage.getItem(doneKey(viewDate,i))==='1');if(!allDone){notice();return}const missing=p.items.map((x,i)=>({x,i})).filter(({x,i})=>strength.has(x)&&!localStorage.getItem(weightKey(viewDate,i)));if(missing.length){notice(`训练已完成，但还缺 ${missing.map(x=>x.x).join('、')} 的重量。填写后会自动提交。`);document.querySelectorAll('.weightField').forEach(e=>e.classList.remove('missing'));missing.forEach(({i})=>document.querySelector(`[data-weight-index="${i}"]`)?.classList.add('missing'));return}notice('已完成，正在自动提交到 GitHub…');p.items.forEach((x,i)=>{if(strength.has(x))record(x,date,localStorage.getItem(weightKey(viewDate,i)))});push().then(ok=>{if(ok)notice('当天训练已完成并自动提交。')});}
function renderHistory(){const box=$('#history');box.innerHTML='';let any=false;strength.forEach(name=>{const h=history(name);if(!h.length)return;any=true;const [last,prev]=h;const trend=prev&&last.weight!==prev.weight?`<div class="historyLine gain">相比上次：重量 ${last.weight-prev.weight>0?'+':''}${last.weight-prev.weight} kg</div>`:'';box.insertAdjacentHTML('beforeend',`<div class="historyCard"><div class="historyName">${name}</div><div class="historyLine">最近：${last.weight} kg · ${last.date}</div>${trend}</div>`)});if(!any)box.innerHTML='<div class="hint">还没有力量训练记录。</div>'}
function render(){const n=idx(viewDate),p=plan[n],weekday=['周日','周一','周二','周三','周四','周五','周六'][viewDate.getDay()];$('#dateText').textContent=`${viewDate.getMonth()+1}月${viewDate.getDate()}日 · ${weekday}`;$('#cyclePill').textContent=`第 ${n+1} 天`;$('#weekText').textContent=`第 ${n<7?1:2} 周`;$('#workoutTitle').textContent=p.name;$('#workoutDesc').textContent=p.desc;const list=$('#workoutList');list.innerHTML='';notice();if(!p.items.length){list.innerHTML='<div class="hint" style="padding:18px 0">今天不安排训练。</div>';$('#bar').style.width='100%';$('#progressText').textContent='休息日'}else{let count=0;p.items.forEach((item,i)=>{const checked=localStorage.getItem(doneKey(viewDate,i))==='1';if(checked)count++;const row=document.createElement('div');row.className='item'+(checked?' done':'');const top=document.createElement('div');top.className='itemTop';const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=checked;check.onchange=()=>{localStorage.setItem(doneKey(viewDate,i),check.checked?'1':'0');render();autoSubmit()};const name=document.createElement('div');name.className='name';name.textContent=item;top.append(check,name);row.append(top);if(strength.has(item)){const prev=history(item).find(x=>x.date<ymd(viewDate));const last=document.createElement('div');last.className='last';last.textContent=prev?`上次：${prev.weight} kg`:'上次：暂无记录';const field=document.createElement('div');field.className='weightField';field.dataset.weightIndex=i;const input=document.createElement('input');input.type='number';input.inputMode='decimal';input.step='0.5';input.min='0';input.placeholder='今天重量';input.value=localStorage.getItem(weightKey(viewDate,i))||'';input.oninput=()=>{localStorage.setItem(weightKey(viewDate,i),input.value);field.classList.remove('missing');autoSubmit()};const unit=document.createElement('span');unit.className='unit';unit.textContent='kg';field.append(input,unit);row.append(last,field)}list.append(row)});$('#bar').style.width=`${Math.round(count/p.items.length*100)}%`;$('#progressText').textContent=`${count} / ${p.items.length} 完成`}const cycle=$('#cycleList');cycle.innerHTML='';plan.forEach((x,i)=>cycle.insertAdjacentHTML('beforeend',`<div class="row${i===n?' now':''}"><div class="rday">第${i+1}天</div><div class="rname">${x.name}</div></div>`));renderHistory()}
$('#prevBtn').onclick=()=>{viewDate.setDate(viewDate.getDate()-1);render()};$('#nextBtn').onclick=()=>{viewDate.setDate(viewDate.getDate()+1);render()};$('#todayBtn').onclick=()=>{viewDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());render()};$('#startDate').onchange=()=>{localStorage.setItem('training_start',$('#startDate').value);render()};$('#ghToken').value=localStorage.getItem('github_token')||'';$('#ghSave').onclick=()=>{const t=$('#ghToken').value.trim();if(!t){status('请输入 token。','bad');return}localStorage.setItem('github_token',t);status('已连接；以后无需重复输入。','good');push()};if(localStorage.getItem('github_token'))status('已连接；当天完成后会自动提交。','good');render();
</script></body></html>
