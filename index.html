<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="训练计划"><meta name="theme-color" content="#0b0b0c"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/app-icon.png"><title>双周训练计划</title>
<style>
:root{--bg:#0b0b0c;--card:#161618;--card2:#1d1d20;--text:#f5f5f7;--muted:#9b9ba1;--line:#2b2b30;--good:#8fe388;--bad:#ff8a8a;--warn:#ffd67d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif}body{min-height:100vh;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.app{max-width:560px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:14px;margin-bottom:18px}h1{font-size:29px;line-height:1.08;margin:0 0 6px;font-weight:760;letter-spacing:-.03em}.sub,.hint{font-size:13px;color:var(--muted);line-height:1.55}.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-size:13px;white-space:nowrap}.hero,.section,.cycle{border:1px solid var(--line);background:var(--card);border-radius:20px;overflow:hidden}.hero{background:linear-gradient(180deg,#18181b,#121214);border-radius:24px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.18)}.eyebrow{font-size:13px;color:var(--muted);margin-bottom:7px}.daytitle{font-size:34px;font-weight:780;letter-spacing:-.035em;margin:0 0 7px}.desc{font-size:15px;color:#c7c7cc;line-height:1.5}.list{display:flex;flex-direction:column;gap:10px;margin:15px 0}.item{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:17px}.itemTop{display:flex;align-items:center;gap:12px}.check{appearance:none;width:24px;height:24px;border-radius:8px;border:1.5px solid #55565d;background:#101012;flex:0 0 auto;display:grid;place-items:center}.check:checked{background:#f5f5f7;border-color:#f5f5f7}.check:checked::after{content:"✓";color:#111;font-size:16px;font-weight:800}.name{font-size:16px;font-weight:600}.done .name{color:#7f7f85;text-decoration:line-through}.last{margin:8px 0 0 36px;font-size:12px;color:var(--muted)}.weightField{display:flex;align-items:center;margin:12px 0 0 36px;background:#101012;border:1px solid var(--line);border-radius:12px;padding:0 10px}.weightField.missing{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}.weightField input{width:100%;min-width:0;padding:10px 0;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.unit{font-size:12px;color:var(--muted);margin-left:4px}.guide{margin:11px 0 0 36px;border:1px solid var(--line);border-radius:12px;background:#101012;overflow:hidden}.guide summary{padding:10px 11px;color:#c7c7cc;font-size:13px;cursor:pointer}.guideBody{border-top:1px solid var(--line);padding:10px}.exercisePhoto{height:185px;border-radius:9px;background-image:url('assets/exercise-guide.png');background-size:300% 300%;background-position:var(--x) var(--y);background-repeat:no-repeat}.cue{margin:9px 2px 1px;font-size:13px;color:#c7c7cc;line-height:1.5}.notice{display:none;margin:14px 0 0;padding:11px 13px;border:1px solid var(--warn);border-radius:13px;color:var(--warn);font-size:13px;line-height:1.45}.notice.show{display:block}.progress{height:7px;background:#242428;border-radius:999px;overflow:hidden;margin:16px 0 3px}.bar{height:100%;width:0;background:var(--good);transition:width .2s ease}.progressText{font-size:12px;color:var(--muted);text-align:right}.nav,.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}.actions{grid-template-columns:1fr 1fr}button{border:0;border-radius:15px;padding:13px 10px;font-size:15px;background:var(--card2);color:var(--text);font-weight:620}button:active{transform:scale(.985)}button.primary{background:#f5f5f7;color:#111}.section{margin-top:15px}.section summary{list-style:none;padding:16px 17px;font-size:15px;font-weight:650;cursor:pointer}.section summary::-webkit-details-marker{display:none}.inner{border-top:1px solid var(--line);padding:16px 17px}label.small{display:block;font-size:13px;color:var(--muted);margin:11px 0 7px}.textinput,input[type=date]{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:#101012;color:var(--text);font-size:16px}.status{font-size:13px;margin-top:10px;color:var(--muted)}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.historyCard{padding:12px 0;border-bottom:1px solid var(--line)}.historyCard:last-child{border:0}.historyName{font-weight:650;margin-bottom:7px}.historyLine{font-size:13px;color:#c7c7cc;line-height:1.6}.gain{color:var(--good)}.cycle{margin-top:14px}.cycleHead{padding:16px 17px;font-weight:650;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 17px;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}.row.now{background:#202024}.rday{color:var(--muted)}.rname{font-weight:600}.footer{font-size:12px;color:#6f6f75;text-align:center;margin:18px 0 4px}
</style></head><body><main class="app">
<div class="top"><div><h1>双周训练计划</h1><div class="sub" id="dateText"></div></div><div class="pill" id="cyclePill">第 1 天</div></div>
<section class="hero"><div class="eyebrow" id="weekText">第 1 周</div><div class="daytitle" id="workoutTitle"></div><div class="desc" id="workoutDesc"></div><div id="workoutList" class="list"></div><div id="notice" class="notice"></div><div class="progress"><div id="bar" class="bar"></div></div><div id="progressText" class="progressText"></div></section>
<nav class="nav"><button id="prevBtn">← 前一天</button><button id="todayBtn" class="primary">今天</button><button id="nextBtn">后一天 →</button></nav>
<details class="section"><summary>进步记录</summary><div class="inner" id="history"></div></details>
<details class="section"><summary>GitHub 连接</summary><div class="inner"><div class="hint">数据会用 gzip 压缩包同步，体积比原先格式小很多。token 只需在此浏览器保存一次。</div><label class="small" for="ghToken">Fine-grained token</label><input id="ghToken" class="textinput" type="password" autocomplete="off" placeholder="github_pat_…"><div class="hint">只授权 <b>DDDDUJJU/workout</b>，权限只需 Contents: Read and write。</div><div class="actions"><button id="ghSave">保存并连接</button><button id="ghPull">从 GitHub 恢复</button></div><div id="ghStatus" class="status">尚未连接</div></div></details>
<details class="section"><summary>设置循环起始日</summary><div class="inner"><label class="small" for="startDate">把哪一天定义为“第 1 天 / 第一周周一”</label><input id="startDate" type="date"><div class="hint">以后会自动按 14 天循环。</div></div></details>
<section class="cycle"><div class="cycleHead">14 天总览</div><div id="cycleList"></div></section><div class="footer">完成当天训练并填完重量后自动同步</div>
</main><script src="app.js"></script></body></html>
